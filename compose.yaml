name: tsunami-copilot
services:
  tsunami-mcp:
    build: .
    image: tsunami-copilot-mcp:0.2.0
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3790:3790"
    volumes:
      # Session cookies written by `npm run login` on the host.
      - ${TSUNAMI_HOST_DATA_DIR:-~/.tsunami-copilot}:/data
      # SQLite lives on a Docker volume: WAL does not work on Windows bind mounts.
      - tsunami_state:/state
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  tsunami_state:
